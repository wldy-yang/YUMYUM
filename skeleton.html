<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>배달말고 🛵</title>
  <style>
    /* ── CSS 변수 (색상 팔레트) ── */
    :root {
      --mint:       #1DC9A0;
      --mint-dark:  #17A882;
      --mint-light: #E8F9F4;
      --text:       #1A1A2E;
      --text-sub:   #6B7280;
      --bg:         #F5F5F5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'Noto Sans KR', sans-serif;
      background: #C8D6DF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ── 폰 프레임 ── */
    #app {
      width: 390px;
      height: 844px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      border-radius: 44px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    }

    /* ── 화면 슬라이드 전환 ──
       active  = 현재 보이는 화면 (translateX 0)
       behind  = 뒤로 밀린 화면  (translateX -25%)
       기본값  = 오른쪽 대기     (translateX 100%)
    */
    .screen {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
      background: var(--bg);
    }
    .screen::-webkit-scrollbar { display: none; }
    .screen.active { transform: translateX(0); }
    .screen.behind { transform: translateX(-25%); }

    /* ── 공통 버튼 ── */
    .back-btn {
      width: 38px; height: 38px;
      background: white; border: none; border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .primary-btn {
      background: var(--mint); color: white; border: none;
      border-radius: 14px; padding: 14px 22px;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .primary-btn:disabled { background: #CCC; cursor: not-allowed; }

    /* 하단 고정 바 */
    .bottom-bar {
      position: sticky; bottom: 0;
      background: white; border-top: 1px solid #EEE;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .total-label { font-size: 12px; color: var(--text-sub); }
    .total-price { font-size: 20px; font-weight: 800; }

    /* ════════ 홈 화면 스타일 ════════ */
    .home-header {
      background: var(--mint);
      padding: 52px 18px 18px;
    }
    .home-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .addr-wrap { text-align: center; }
    .addr-label { font-size: 11px; color: rgba(255,255,255,0.75); }
    .addr-name  { font-size: 19px; font-weight: 700; color: white; }

    .cart-icon-btn {
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.22); border: none; border-radius: 13px;
      font-size: 20px; cursor: pointer;
    }
    .search-box {
      background: white; border-radius: 14px;
      padding: 12px 16px;
      color: var(--text-sub); font-size: 14px;
    }
    .home-body { padding: 16px; }

    /* 식당 카드 */
    .rest-card {
      background: white; border-radius: 16px; overflow: hidden;
      margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      cursor: pointer;
    }
    .rest-card:active { opacity: 0.85; }
    .rest-thumb {
      height: 155px;
      display: flex; align-items: center; justify-content: center;
      font-size: 64px;
    }
    .rest-info { padding: 13px 15px; }
    .rest-info h4 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .rest-meta { display: flex; gap: 10px; font-size: 13px; color: var(--text-sub); }

    /* ════════ 식당 메뉴 화면 스타일 ════════ */
    .rest-hero {
      height: 190px;
      display: flex; align-items: center; justify-content: center;
      position: relative; font-size: 80px;
    }
    .rest-hero .back-btn { position: absolute; top: 52px; left: 16px; }
    .rest-info-bar { background: white; padding: 16px 18px; border-bottom: 1px solid #F2F2F2; }
    .rest-info-bar h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }

    .menu-item {
      background: white; padding: 15px 18px;
      display: flex; align-items: center; gap: 13px;
      border-bottom: 1px solid #F8F8F8;
    }
    .menu-emoji-box {
      width: 58px; height: 58px;
      background: var(--bg); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; flex-shrink: 0;
    }
    .menu-detail { flex: 1; }
    .menu-detail .name  { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .menu-detail .price { font-size: 14px; font-weight: 700; color: var(--mint-dark); }

    .qty-ctrl { display: flex; align-items: center; gap: 9px; }
    .qty-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid var(--mint);
      background: white; color: var(--mint);
      font-size: 17px; font-weight: 700; cursor: pointer;
    }
    .qty-num { font-size: 16px; font-weight: 700; min-width: 18px; text-align: center; }

    /* ════════ 장바구니 화면 스타일 ════════ */
    .cart-header {
      background: white; padding: 52px 18px 16px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid #F2F2F2;
    }
    .cart-header h2 { font-size: 18px; font-weight: 700; }

    .cart-item {
      background: white; padding: 15px 18px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid #F8F8F8;
    }
    .cart-item .name  { font-size: 15px; font-weight: 600; }
    .cart-item .price { font-size: 13px; color: var(--text-sub); margin-top: 3px; }
    .del-btn { background: none; border: none; color: #CCC; font-size: 19px; cursor: pointer; }

    .summary-box { background: white; margin: 12px 16px; border-radius: 16px; padding: 16px; }
    .sum-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-sub); margin-bottom: 9px; }
    .sum-row.total { color: var(--text); font-weight: 700; font-size: 16px; border-top: 1px solid #EEE; padding-top: 10px; }

    .pay-section { background: white; margin: 0 16px 16px; border-radius: 16px; padding: 16px; }
    .pay-section h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pay-opt {
      border: 2px solid #E0E0E0; border-radius: 12px;
      padding: 11px 8px; text-align: center; cursor: pointer;
      font-size: 13px; font-weight: 600; color: var(--text-sub);
    }
    .pay-opt.on { border-color: var(--mint); background: var(--mint-light); color: var(--mint-dark); }

    /* ════════ 로딩 화면 스타일 ════════ */
    #screen-loading {
      background: var(--mint);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; color: white;
    }
    .moto    { font-size: 64px; animation: bounce 0.8s ease infinite; }
    .spinner { width: 52px; height: 52px; border: 5px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.75s linear infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    @keyframes spin   { to{transform:rotate(360deg)} }

    /* ════════ 완료 화면 스타일 ════════ */
    .complete-hero { background: linear-gradient(135deg, var(--mint), #0EA5E9); padding: 64px 28px 36px; text-align: center; color: white; }
    .complete-hero .big-emoji { font-size: 72px; margin-bottom: 14px; }
    .complete-hero h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .stats-card { background: white; margin: 14px 16px; border-radius: 20px; padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .stats-card h3 { text-align: center; font-size: 13px; color: var(--text-sub); margin-bottom: 14px; }
    .stat-row { display: flex; justify-content: space-around; }
    .stat-item { text-align: center; }
    .stat-val { font-size: 26px; font-weight: 800; color: var(--mint-dark); }
    .stat-lbl { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
    .motive-card { background: linear-gradient(135deg, #FF6B35, #FF9A3C); margin: 0 16px 14px; border-radius: 18px; padding: 18px 20px; color: white; text-align: center; font-size: 15px; font-weight: 700; line-height: 1.6; }
    .again-btn { display: block; width: calc(100% - 32px); margin: 0 16px 32px; background: var(--mint); color: white; border: none; border-radius: 16px; padding: 16px; font-size: 17px; font-weight: 700; cursor: pointer; }
  </style>
</head>

// 앞으로 이동
function nav(id) {
  if (id === 'cart') renderCart(); // 장바구니 화면 열 때마다 새로 그리기

  const curId = history[history.length - 1];
  if (curId === id) return;

  document.getElementById('screen-' + curId).classList.add('behind');
  document.getElementById('screen-' + id).classList.add('active');
  history.push(id);
}

// 뒤로 이동
function back() {
  if (history.length <= 1) return;
  const curId  = history.pop();
  const prevId = history[history.length - 1];

  document.getElementById('screen-' + curId).classList.remove('active');
  document.getElementById('screen-' + prevId).classList.remove('behind');
}

// 특정 화면만 표시 (로딩→완료 전환 등에 사용)
function showOnly(id) {
  document.querySelectorAll('.screen').forEach(s =>
    s.classList.remove('active', 'behind')
  );
  document.getElementById('screen-' + id).classList.add('active');
  history = [id];
}

// 결제수단 선택
function selectPay(el) {
  document.querySelectorAll('.pay-opt').forEach(e => e.classList.remove('on'));

}
